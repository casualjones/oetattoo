<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music - OE Tattoo</title>
    <meta name="description" content="Self-released songs and personal music from OE Tattoo.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">OE / Doorway</a>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="portfolio.html" class="nav-link">Gallery</a></li>
                <li><a href="tools.html" class="nav-link">Tools</a></li>
                <li><a href="contact.html" class="nav-link">Social</a></li>
                <li><a href="events.html" class="nav-link">Interesting</a></li>
                <li><a href="songs.html" class="nav-link" aria-current="page">Music</a></li>
            </ul>
            <button class="hamburger" type="button" aria-label="Open menu"><span></span><span></span><span></span></button>
        </div>
    </nav>

    <main class="page-shell">
        <section class="page-hero">
            <span class="eyebrow">05 // MUSIC</span>
            <h1>Self release.</h1>
            <p>Personal songs, demos, and releases.</p>
        </section>

        <section class="page-grid song-library">
            <article class="page-card song-card">
                <h2>Library</h2>
                <div id="songsList" class="songs-list">
                </div>
            </article>

            <article class="page-card song-card">
                <h2>Now playing</h2>
                <div id="nowPlaying" class="now-playing-info">
                    <span id="currentSong">No song selected</span>
                    <div id="progressContainer" class="progress-container" style="display: none;">
                        <div id="progressBar" class="progress-bar"></div>
                        <div class="progress-times">
                            <span id="currentTime">0:00</span>
                            <span id="totalTime">0:00</span>
                        </div>
                    </div>
                </div>
                <div class="player-controls">
                    <button id="prevBtn" class="player-btn">⏮</button>
                    <button id="playPauseBtn" class="player-btn">▶</button>
                    <button id="nextBtn" class="player-btn">⏭</button>
                    <div class="volume-control">
                        <span>🔊</span>
                        <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.7">
                    </div>
                </div>
            </article>
        </section>
    </main>

    <footer class="footer compact-footer">
        <div class="container footer-row">
            <p>OE Tattoo</p>
            <p>Self release</p>
        </div>
    </footer>

    <audio id="audioPlayer" preload="none"></audio>

    <script defer src="script.js"></script>
    <script src="songs.js"></script>
</body>
</html>
